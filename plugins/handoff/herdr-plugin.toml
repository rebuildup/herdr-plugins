id = "rebuildup.handoff"
name = "Handoff"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Handoff / delegation foundation: versioned handoff records binding a source pane/agent generation to a payload of references (conversations, checkpoints, excerpts) plus a status lifecycle."
platforms = ["linux", "macos", "windows"]

# No build step: the plugin is dependency-free TypeScript executed by Bun
# (runtime prerequisite, see plugins/handoff/README.md).
#
# No [[actions]] / [[events]] / [[startup]] yet: T1 (#103) ships the
# payload contract, state store, and read-side commands only. Execution
# (workspace/pane creation, agent.start, status transitions) is T2 (#104).
