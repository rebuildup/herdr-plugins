id = "rebuildup.machines"
name = "Machines"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Remote machines inventory: read-only list/probe/capability over herdr saved machines — reachability, remote herdr version/protocol, and plugin surface via the ADR-0020 SavedSshApiBridge path. Machine lifecycle stays with the herdr CLI; no credential handling (herdr-plugins.machines/v1)."
platforms = ["linux", "macos", "windows"]

# No build step: the plugin is dependency-free TypeScript executed by Bun
# (runtime prerequisite, see plugins/machines/README.md).
#
# No [[events]] / [[startup]]: inventory and probe are explicit
# invocations. Issue #161 (parent #34, ADR-0028): read-only
# inventory/probe only — machine add/remove/enable/disable is never
# reimplemented.
#
# TUI surface (#247, contract herdr-plugins.tui/v1, ADR-0031/0032/0033):
# `main` pane = machines browser (list + on-demand probe + capability
# info; read-only — no mutating affordance); `open` action opens it in
# a tab. CLI behavior is unchanged.

[[panes]]
id = "main"
title = "Machines: inventory"
description = "Saved machines browser: list with last-known probe state, on-demand probe (progress + cancel), plugin-surface support, capability info. Read-only."
platforms = ["linux", "macos", "windows"]
placement = "tab"
command = ["bun", "run", "src/tui.ts", "main"]

[[actions]]
id = "open"
title = "Machines: open inventory UI"
description = "Open the machines inventory TUI in a new tab."
contexts = ["pane", "workspace"]
command = ["bun", "run", "src/tui.ts", "open"]
