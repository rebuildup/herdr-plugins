id = "rebuildup.controls"
name = "Controls"
version = "0.6.0"
min_herdr_version = "0.9.0"
description = "Agent operation core over the herdr agent.* socket API: send, provider slash-command passthrough, wait-for-state, PTY-level interrupt, scrollback read, rename, and launch-time controls (model/permission-mode/resume args) under herdr-plugins.controls/v1."
platforms = ["linux", "macos", "windows"]

# No build step: the plugin is dependency-free TypeScript executed by Bun
# (runtime prerequisite, see plugins/controls/README.md).
#
# Interactive TUI surface (#245, contract docs/contracts/tui-v1.md,
# ADR-0031/0032/0033): one tab-placed pane entrypoint plus an `open`
# action that pins the origin context and calls `plugin.pane.open`.
# The UI consumes this plugin's own CLI for every contract operation
# (so --expect-* stale-generation guards stay the enforcement point)
# and session.snapshot/agent.get/pane.focus via the documented socket
# API for read-only enumeration and focus. Boundary: plain agent
# browsing/attach stays in the herdr TUI; this surface exposes only
# contract capabilities (send/command/wait/interrupt/read/rename/start
# with the launch table). Mutations are confirm-gated and checked
# against `capability`/`mutation_commands`.

[[panes]]
id = "main"
title = "Controls: agents"
description = "Agent operation surface: send/command/wait/interrupt/read/rename plus agent.start with launch options (model/permission-mode/resume)."
platforms = ["linux", "macos", "windows"]
placement = "tab"
command = ["bun", "run", "src/tui.ts", "main"]

[[actions]]
id = "open"
title = "Controls: open agent UI"
description = "Open the controls agent-operation TUI in a new tab."
contexts = ["pane", "workspace"]
command = ["bun", "run", "src/tui.ts", "open"]
