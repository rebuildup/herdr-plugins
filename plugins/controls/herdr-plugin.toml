id = "rebuildup.controls"
name = "Controls"
version = "0.7.0"
min_herdr_version = "0.9.0"
description = "Agent operation core over the herdr agent.* socket API: send, wait-for-state, PTY-level interrupt, scrollback read, rename, and launch-time controls (model/permission-mode/resume args) under herdr-plugins.controls/v1."
platforms = ["linux", "macos", "windows"]

# No build step: the plugin is dependency-free TypeScript executed by Bun
# (runtime prerequisite, see plugins/controls/README.md).
#
# No [[actions]] / [[events]] / [[startup]] yet: every operation is an
# explicit, argument-bearing CLI invocation. Pane-context actions and
# event hooks can be layered on once consumers (#6 handoff, #29 textgen)
# define their trigger semantics.
