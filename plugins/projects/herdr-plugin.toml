id = "rebuildup.projects"
name = "Projects"
version = "0.4.0"
min_herdr_version = "0.9.0"
description = "Project registry for herdr panes: multi-repo grouping, pin/archive, settings overrides, project-defined scripts, runOnWorktreeCreate auto-triggers, the read-only repo↔worktree/diff association on repos list, and runOnSettle/stopOnSettle triggers via the inbox organize-transition log (contract herdr-plugins.projects/v1, stable; additive v0.4.0)."
platforms = ["linux", "macos", "windows"]

# No build step: the plugin is dependency-free TypeScript executed by Bun
# (runtime prerequisite, see plugins/projects/README.md).
#
# Event hooks (#180): `worktree.created` appends a pending trigger mark
# (src/hook.ts — no socket/git work, must never affect herdr, ADR-0002).
# Marks drain lazily on the next `scripts`-family CLI call; no daemon,
# no polling (same mechanism as plugins/automations #146).
#
# Interactive TUI surface (#240, contract docs/contracts/tui-v1.md,
# ADR-0031/0032/0033): one tab-placed pane entrypoint plus an `open`
# action that pins the origin context and calls `plugin.pane.open`.
# The UI consumes this plugin's own CLI for every read/mutation, so the
# public contract stays the single source of truth; mutations are
# confirm-gated and checked against `capability`/`mutation_commands`.

[[panes]]
id = "main"
title = "Projects: registry"
description = "Project registry browser: list/search/select, register+discover, repo membership, settings, scripts, repo↔worktree info."
platforms = ["linux", "macos", "windows"]
placement = "tab"
command = ["bun", "run", "src/tui.ts", "main"]

[[actions]]
id = "open"
title = "Projects: open registry UI"
description = "Open the projects registry TUI in a new tab."
contexts = ["pane", "workspace"]
command = ["bun", "run", "src/tui.ts", "open"]

[[events]]
on = "worktree.created"
command = ["bun", "run", "src/hook.ts"]
