id = "rebuildup.checkpoints"
name = "Checkpoints"
version = "0.4.0"
min_herdr_version = "0.9.0"
description = "Worktree checkpoints as hidden git refs: capture, list, show, diff, plan, safe restore, multi-repo save/restore groups, and retention GC."
platforms = ["linux", "macos", "windows"]

# No build step: the plugin is dependency-free TypeScript executed by Bun
# (runtime prerequisite, see plugins/checkpoints/README.md).
#
# Interactive TUI surface (#242, contract docs/contracts/tui-v1.md,
# ADR-0031/0032/0033): one tab-placed pane entrypoint plus an `open`
# action that pins the origin context and calls `plugin.pane.open`.
# The UI consumes this plugin's own CLI for every read/mutation (reads
# pass --no-drain so opening never runs the lazy pending-capture
# drain), so the public contract stays the single source of truth;
# mutations are confirm-gated and checked against
# `capability`/`mutation_commands`.
#
# One pane-context action: `create` resolves the focused pane's repo via
# HERDR_PLUGIN_CONTEXT_JSON. list/show/diff/delete take checkpoint ids and
# stay CLI/agent-invoked only.

[[panes]]
id = "main"
title = "Checkpoints: browser"
description = "Checkpoint browser: list/search, show/diff/plan preview, guarded create/save/restore/delete, groups, gc/prune dry-run-first."
platforms = ["linux", "macos", "windows"]
placement = "tab"
command = ["bun", "run", "src/tui.ts", "main"]

[[actions]]
id = "open"
title = "Checkpoints: open UI"
description = "Open the checkpoints browser TUI in a new tab."
contexts = ["pane", "workspace"]
command = ["bun", "run", "src/tui.ts", "open"]

[[actions]]
id = "create"
title = "Checkpoints: capture pane state"
description = "Capture the focused pane repository's worktree state as a hidden-ref checkpoint."
contexts = ["pane"]
command = ["bun", "run", "src/cli.ts", "create"]

# Event hooks (Issue #74): a working→idle/done agent-status transition
# records a capture-pending mark — the hook does no git work; the next
# CLI invocation captures lazily. pane.closed drops the pane's marks.
[[events]]
on = "pane.agent_status_changed"
command = ["bun", "run", "src/hook.ts"]

[[events]]
on = "pane.closed"
command = ["bun", "run", "src/hook.ts"]
