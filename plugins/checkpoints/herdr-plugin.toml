id = "rebuildup.checkpoints"
name = "Checkpoints"
version = "0.4.0"
min_herdr_version = "0.9.0"
description = "Worktree checkpoints as hidden git refs: capture, list, show, diff, plan, safe restore, multi-repo save/restore groups, and retention GC."
platforms = ["linux", "macos", "windows"]

# No build step: the plugin is dependency-free TypeScript executed by Bun
# (runtime prerequisite, see plugins/checkpoints/README.md).
#
# One pane-context action: `create` resolves the focused pane's repo via
# HERDR_PLUGIN_CONTEXT_JSON. list/show/diff/delete take checkpoint ids and
# stay CLI/agent-invoked only.

[[actions]]
id = "create"
title = "Checkpoints: capture pane state"
description = "Capture the focused pane repository's worktree state as a hidden-ref checkpoint."
contexts = ["pane"]
command = ["bun", "run", "src/cli.ts", "create"]

# Event hooks (Issue #74): a working→idle/done agent-status transition
# records a capture-pending mark — the hook does no git work; the next
# CLI invocation captures lazily. pane.closed drops the pane's marks.
[[events]]
on = "pane.agent_status_changed"
command = ["bun", "run", "src/hook.ts"]

[[events]]
on = "pane.closed"
command = ["bun", "run", "src/hook.ts"]
