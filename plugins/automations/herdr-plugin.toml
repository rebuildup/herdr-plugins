id = "rebuildup.automations"
name = "Automations"
version = "0.8.0"
min_herdr_version = "0.9.0"
description = "Scheduled and triggered agent runs: interval/fixed_time/once tasks fired by OS schedulers or an opt-in watch process, plus event schedules fired by herdr lifecycle hooks (contract herdr-plugins.automations/v1, stable). Webhook triggers are unsupported in v1 — upstream gap, ADR-0026."
platforms = ["linux", "macos", "windows"]

# No build step: dependency-free TypeScript executed by Bun
# (ADR-0003). T3 (#145): firing drivers (`fire`/`tick`/`watch`/
# `schedule install|uninstall|status`), run delivery via
# agent.prompt/agent.start, idempotent task_id+scheduled_for runs,
# misfire policies, driver.state reporting. T4 (#146): `event`
# schedules — every herdr plugin-hook event is recorded as a pending
# mark by src/hook.ts and drained lazily by the next `tick` (no
# daemon, checkpoints auto-capture precedent); agent_status_changed
# also folds observed status into delivered runs. T5 (#147): webhook
# triggers resolved as an upstream gap (ADR-0026) — no `serve`,
# `webhook` schedules stay `unsupported_schedule`; contract v1
# finalized STABLE.
#
# Interactive TUI surface (#243, contract docs/contracts/tui-v1.md,
# ADR-0031/0032/0033): one tab-placed pane entrypoint plus an `open`
# action that pins the origin context and calls `plugin.pane.open`.
# The UI consumes this plugin's own CLI for every read/mutation (with
# `--socket` pinned to the launch session), so the public contract
# stays the single source of truth; task CRUD/schedule/destination
# edits go through guided forms, run-now/delete/tick/schedule/watch
# are confirm-gated via `mutation_commands`, and lazy mutations
# (tick drain, reconcile, schedule status) are explicit-only — never
# implicit on open.

[[panes]]
id = "main"
title = "Automations: tasks"
description = "Automation task browser: list/search, create/edit tasks (schedule + destination forms), enable/disable, run-now, runs history, driver diagnostics (OS scheduler/watch/tick)."
platforms = ["linux", "macos", "windows"]
placement = "tab"
command = ["bun", "run", "src/tui.ts", "main"]

[[actions]]
id = "open"
title = "Automations: open UI"
description = "Open the automations TUI in a new tab."
contexts = ["pane", "workspace"]
command = ["bun", "run", "src/tui.ts", "open"]

# Event hooks (#146): one [[events]] entry per upstream
# PLUGIN_HOOK_EVENT_KINDS name so `event` schedules can subscribe to
# any of them. The hook only records marks — firing happens on the
# next `tick`. `pane.agent_status_changed` additionally updates run
# observations. Event names unknown to an older herdr produce a
# non-fatal manifest warning and simply never fire.

[[events]]
on = "workspace.created"
command = ["bun", "run", "src/hook.ts"]

[[events]]
on = "workspace.updated"
command = ["bun", "run", "src/hook.ts"]

[[events]]
on = "workspace.closed"
command = ["bun", "run", "src/hook.ts"]

[[events]]
on = "workspace.renamed"
command = ["bun", "run", "src/hook.ts"]

[[events]]
on = "workspace.moved"
command = ["bun", "run", "src/hook.ts"]

[[events]]
on = "workspace.reordered"
command = ["bun", "run", "src/hook.ts"]

[[events]]
on = "workspace.focused"
command = ["bun", "run", "src/hook.ts"]

[[events]]
on = "worktree.created"
command = ["bun", "run", "src/hook.ts"]

[[events]]
on = "worktree.opened"
command = ["bun", "run", "src/hook.ts"]

[[events]]
on = "worktree.removed"
command = ["bun", "run", "src/hook.ts"]

[[events]]
on = "tab.created"
command = ["bun", "run", "src/hook.ts"]

[[events]]
on = "tab.closed"
command = ["bun", "run", "src/hook.ts"]

[[events]]
on = "tab.renamed"
command = ["bun", "run", "src/hook.ts"]

[[events]]
on = "tab.moved"
command = ["bun", "run", "src/hook.ts"]

[[events]]
on = "tab.focused"
command = ["bun", "run", "src/hook.ts"]

[[events]]
on = "pane.created"
command = ["bun", "run", "src/hook.ts"]

[[events]]
on = "pane.closed"
command = ["bun", "run", "src/hook.ts"]

[[events]]
on = "pane.focused"
command = ["bun", "run", "src/hook.ts"]

[[events]]
on = "pane.moved"
command = ["bun", "run", "src/hook.ts"]

[[events]]
on = "pane.exited"
command = ["bun", "run", "src/hook.ts"]

[[events]]
on = "pane.agent_detected"
command = ["bun", "run", "src/hook.ts"]

[[events]]
on = "pane.agent_status_changed"
command = ["bun", "run", "src/hook.ts"]
