id = "rebuildup.secrets"
name = "Secrets"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Secret reference resolution and env injection (herdr-plugins.secrets/v1): Infisical-only declared bindings resolved per invocation and injected into child-process env (run) or herdr surface-creation env params (inject). Values are never persisted, logged, placed in argv, or emitted — boundary per ADR-0027."
platforms = ["linux", "macos", "windows"]

# No build step: the plugin is dependency-free TypeScript executed by Bun
# (runtime prerequisite, see plugins/secrets/README.md).
#
# No [[actions]] / [[events]] / [[startup]]: resolution and injection are
# explicit CLI invocations only. Consent is declared bindings in
# config.json plus per-invocation --binding selection (ADR-0027 §2);
# there is no ambient env harvesting and no wildcard injection.
