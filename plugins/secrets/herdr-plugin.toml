id = "rebuildup.secrets"
name = "Secrets"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Secret reference resolution and env injection (herdr-plugins.secrets/v1): Infisical-only declared bindings resolved per invocation and injected into child-process env (run) or herdr surface-creation env params (inject). Values are never persisted, logged, placed in argv, or emitted — boundary per ADR-0027."
platforms = ["linux", "macos", "windows"]

# No build step: the plugin is dependency-free TypeScript executed by Bun
# (runtime prerequisite, see plugins/secrets/README.md).
#
# No [[events]] / [[startup]]: resolution and injection are explicit
# invocations only. Consent is declared bindings in config.json plus
# per-invocation --binding selection (ADR-0027 §2); there is no
# ambient env harvesting and no wildcard injection.
#
# TUI surface (#247, contract herdr-plugins.tui/v1, ADR-0031/0032/0033):
# `main` pane = bindings browser (list/select, metadata-only resolve
# preview, explicit run/inject); `open` action opens it in a tab.
# Secret values are never rendered — binding names only (ADR-0027).
# CLI behavior is unchanged.

[[panes]]
id = "main"
title = "Secrets: bindings"
description = "Secret bindings browser: list/select, metadata-only resolve preview, explicit run/inject. Values are never displayed (ADR-0027)."
platforms = ["linux", "macos", "windows"]
placement = "tab"
command = ["bun", "run", "src/tui.ts", "main"]

[[actions]]
id = "open"
title = "Secrets: open bindings UI"
description = "Open the secrets bindings TUI in a new tab."
contexts = ["pane", "workspace"]
command = ["bun", "run", "src/tui.ts", "open"]
