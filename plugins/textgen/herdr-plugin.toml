id = "rebuildup.textgen"
name = "TextGen"
version = "0.6.0"
min_herdr_version = "0.9.0"
description = "Text generation contract (herdr-plugins.textgen/v1): six generation tasks (thread title, branch name, commit message, PR content, review guide, next prompt) resolved across agent-pane providers and opt-in API generators, with a strict input boundary and validated outputs. Generation only — git/forge execution stays with the caller."
platforms = ["linux", "macos", "windows"]

# No build step: the plugin is dependency-free TypeScript executed by Bun
# (runtime prerequisite, see plugins/textgen/README.md).
#
# Execution paths (ADR-0017): the default `agent` path drives a dedicated
# herdr pane via the Socket API (`workspace.create` → `agent.start` →
# `agent.prompt --wait` → `agent.read` → cleanup), so generation stays
# visible, interruptible, and under herdr's PTY authority. API generators
# are opt-in per config (ADR-0018 credential boundary). No
# [[actions]] / [[events]] / [[startup]] yet: generation is an explicit
# CLI invocation; event-driven triggers (e.g. next_prompt on turn
# completion) are T3/#109 scope.
