id = "rebuildup.inbox"
name = "Inbox"
version = "0.5.0"
min_herdr_version = "0.9.0"
description = "Work inbox for agent panes: settle, snooze, pin, archive, manual ordering, search/filter, explicit PR/Issue links, restore with persistent user-side organize state, a read-only organize-transition log, and an opt-in watch-pr PR-update watcher (contract herdr-plugins.inbox/v1, stable; additive v0.4.0/v0.5.0)."
platforms = ["linux", "macos", "windows"]

# No build step: the plugin is dependency-free TypeScript executed by Bun
# (runtime prerequisite, see plugins/inbox/README.md).

[[actions]]
id = "settle"
title = "Inbox: settle pane"
description = "Hide the focused agent pane from the inbox until its state changes."
contexts = ["pane"]
command = ["bun", "run", "src/cli.ts", "settle"]

[[actions]]
id = "restore"
title = "Inbox: restore pane"
description = "Return the focused agent pane to the inbox and clear all organize state."
contexts = ["pane"]
command = ["bun", "run", "src/cli.ts", "restore"]

[[actions]]
id = "snooze"
title = "Inbox: snooze pane"
description = "Hide the focused agent pane until the configured snooze duration elapses."
contexts = ["pane"]
command = ["bun", "run", "src/cli.ts", "snooze"]

[[actions]]
id = "pin"
title = "Inbox: pin pane"
description = "Pin the focused agent pane to the top of the inbox."
contexts = ["pane"]
command = ["bun", "run", "src/cli.ts", "pin"]

[[actions]]
id = "unpin"
title = "Inbox: unpin pane"
description = "Remove the pin from the focused agent pane."
contexts = ["pane"]
command = ["bun", "run", "src/cli.ts", "unpin"]

[[actions]]
id = "archive"
title = "Inbox: archive pane"
description = "Archive the focused agent pane out of the default inbox view. Never stops or closes the agent."
contexts = ["pane"]
command = ["bun", "run", "src/cli.ts", "archive"]

[[actions]]
id = "unarchive"
title = "Inbox: unarchive pane"
description = "Return the focused agent pane from the archive to the inbox."
contexts = ["pane"]
command = ["bun", "run", "src/cli.ts", "unarchive"]

# Startup hook: one reconcile pass at server start materializes expired
# snoozes and repairs metadata tokens after restarts. No resident process.
[[startup]]
command = ["bun", "run", "src/cli.ts", "reconcile"]

# Event hooks: keep organize state consistent with herdr lifecycle events
# (auto-restore on state_change_seq advance, agent-session mismatch, expiry;
# drop state when a pane closes).
[[events]]
on = "pane.agent_status_changed"
command = ["bun", "run", "src/hook.ts"]

[[events]]
on = "pane.closed"
command = ["bun", "run", "src/hook.ts"]
